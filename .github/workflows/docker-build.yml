name: Publish Docker image (Multi-arch)

on:
  push:
    tags:
      - '*'
      - '!nightly*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to build (e.g., v0.10.8-alpha.3)'
        required: true
        type: string

concurrency:
  group: docker-release-final-tags
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/genistarwynth/wynth-api
  STAGING_PREFIX: staging-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  build_single_arch:
    name: Build, stage, and sign (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    outputs:
      tag: ${{ steps.version.outputs.tag }}

    permissions:
      packages: write
      contents: read
      id-token: write

    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && 0 || 1 }}
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve tag & write VERSION
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
            if ! git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "::error::Tag '$TAG' does not exist"
              exit 1
            fi
          else
            TAG=${GITHUB_REF#refs/tags/}
          fi
          echo "TAG=${TAG}" >> $GITHUB_ENV
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "${TAG}" > VERSION
          echo "Building tag: ${TAG} for ${{ matrix.arch }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Check cosign readiness
        run: cosign version

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}

      - name: Build and push staged image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE }}:${{ env.STAGING_PREFIX }}-${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Sign staged image digest
        run: cosign sign --yes "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"

      - name: Staged image summary
        run: |
          echo "### Staged Docker Image Digest (${{ matrix.arch }})" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${IMAGE}:${STAGING_PREFIX}-${{ matrix.arch }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  create_manifests:
    name: Create multi-arch manifests
    needs: [build_single_arch]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    permissions:
      packages: write
      id-token: write

    env:
      TAG: ${{ needs.build_single_arch.outputs.tag }}

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Check cosign readiness
        run: cosign version

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve and verify staged architecture digests
        run: |
          set -euo pipefail
          AMD64_DIGEST=$(docker buildx imagetools inspect \
            "$IMAGE:$STAGING_PREFIX-amd64" \
            --format '{{.Manifest.Digest}}')
          ARM64_DIGEST=$(docker buildx imagetools inspect \
            "$IMAGE:$STAGING_PREFIX-arm64" \
            --format '{{.Manifest.Digest}}')

          for DIGEST in "$AMD64_DIGEST" "$ARM64_DIGEST"; do
            if ! [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Invalid staged image digest: $DIGEST"
              exit 1
            fi
          done

          CERTIFICATE_IDENTITY="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/docker-build.yml@${GITHUB_REF}"
          cosign verify \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$IMAGE@$AMD64_DIGEST"
          cosign verify \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$IMAGE@$ARM64_DIGEST"

          echo "AMD64_DIGEST=$AMD64_DIGEST" >> "$GITHUB_ENV"
          echo "ARM64_DIGEST=$ARM64_DIGEST" >> "$GITHUB_ENV"

      - name: Create staged multi-arch manifest
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "$IMAGE:$STAGING_PREFIX-manifest" \
            "$IMAGE@$AMD64_DIGEST" \
            "$IMAGE@$ARM64_DIGEST"

          MANIFEST_DIGEST=$(docker buildx imagetools inspect \
            "$IMAGE:$STAGING_PREFIX-manifest" \
            --format '{{.Manifest.Digest}}')
          if ! [[ "$MANIFEST_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid staged manifest digest: $MANIFEST_DIGEST"
            exit 1
          fi
          echo "MANIFEST_DIGEST=$MANIFEST_DIGEST" >> "$GITHUB_ENV"

      - name: Sign and verify staged manifest digest
        run: |
          set -euo pipefail
          cosign sign --yes "$IMAGE@$MANIFEST_DIGEST"

          CERTIFICATE_IDENTITY="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/docker-build.yml@${GITHUB_REF}"
          cosign verify \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$IMAGE@$MANIFEST_DIGEST"

      - name: Validate digest-preserving promotion
        run: |
          set -euo pipefail
          docker buildx imagetools create --prefer-index=false \
            -t "$IMAGE:$STAGING_PREFIX-promote-amd64" \
            "$IMAGE@$AMD64_DIGEST"
          docker buildx imagetools create --prefer-index=false \
            -t "$IMAGE:$STAGING_PREFIX-promote-arm64" \
            "$IMAGE@$ARM64_DIGEST"
          docker buildx imagetools create --prefer-index=false \
            -t "$IMAGE:$STAGING_PREFIX-promote-manifest" \
            "$IMAGE@$MANIFEST_DIGEST"

          test "$(docker buildx imagetools inspect "$IMAGE:$STAGING_PREFIX-promote-amd64" --format '{{.Manifest.Digest}}')" = "$AMD64_DIGEST"
          test "$(docker buildx imagetools inspect "$IMAGE:$STAGING_PREFIX-promote-arm64" --format '{{.Manifest.Digest}}')" = "$ARM64_DIGEST"
          test "$(docker buildx imagetools inspect "$IMAGE:$STAGING_PREFIX-promote-manifest" --format '{{.Manifest.Digest}}')" = "$MANIFEST_DIGEST"

      - name: Promote signed version digests
        run: |
          set -euo pipefail
          docker buildx imagetools create --prefer-index=false \
            -t "$IMAGE:$TAG-amd64" \
            "$IMAGE@$AMD64_DIGEST"
          docker buildx imagetools create --prefer-index=false \
            -t "$IMAGE:$TAG-arm64" \
            "$IMAGE@$ARM64_DIGEST"
          docker buildx imagetools create --prefer-index=false \
            -t "$IMAGE:$TAG" \
            "$IMAGE@$MANIFEST_DIGEST"

          test "$(docker buildx imagetools inspect "$IMAGE:$TAG-amd64" --format '{{.Manifest.Digest}}')" = "$AMD64_DIGEST"
          test "$(docker buildx imagetools inspect "$IMAGE:$TAG-arm64" --format '{{.Manifest.Digest}}')" = "$ARM64_DIGEST"
          test "$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{.Manifest.Digest}}')" = "$MANIFEST_DIGEST"

      - name: Promote signed latest digests
        run: |
          set -euo pipefail
          docker buildx imagetools create --prefer-index=false \
            -t "$IMAGE:latest-amd64" \
            "$IMAGE@$AMD64_DIGEST"
          docker buildx imagetools create --prefer-index=false \
            -t "$IMAGE:latest-arm64" \
            "$IMAGE@$ARM64_DIGEST"
          docker buildx imagetools create --prefer-index=false \
            -t "$IMAGE:latest" \
            "$IMAGE@$MANIFEST_DIGEST"

          test "$(docker buildx imagetools inspect "$IMAGE:latest-amd64" --format '{{.Manifest.Digest}}')" = "$AMD64_DIGEST"
          test "$(docker buildx imagetools inspect "$IMAGE:latest-arm64" --format '{{.Manifest.Digest}}')" = "$ARM64_DIGEST"
          test "$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{.Manifest.Digest}}')" = "$MANIFEST_DIGEST"

      - name: Manifest summary
        run: |
          echo "### Multi-arch Manifest" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect "$IMAGE:$TAG" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
